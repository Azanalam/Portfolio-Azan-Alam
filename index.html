<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azan Alam Portfolio</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('portfolio-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var currentFetch = typeof window !== 'undefined' ? window.fetch : null;
          if (currentFetch) {
            var descriptor = {
              get: function () {
                return currentFetch;
              },
              set: function (val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            };
            try {
              Object.defineProperty(window, 'fetch', descriptor);
            } catch (e1) {
              try {
                if (window.Window && window.Window.prototype) {
                  Object.defineProperty(window.Window.prototype, 'fetch', descriptor);
                }
              } catch (e2) {}
            }
          }
        } catch (err) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
